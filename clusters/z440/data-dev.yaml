apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: data-dev
  namespace: flux-system
spec:
  interval: 5m
  path: ./data/dev
  # Databases must not disappear because a Git path was renamed or removed.
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
  wait: true
  timeout: 15m
