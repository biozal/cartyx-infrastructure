apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - helmrelease.yaml
  - ../../deploy/data
patches:
  - target:
      kind: CronJob
      name: cartyx-data-backup
    patch: |-
      - op: replace
        path: /spec/schedule
        value: '0 9 * * *'
      - op: replace
        path: /spec/suspend
        value: false
