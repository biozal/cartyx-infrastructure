---
# Chart source for this cluster's dev namespace. Production moved to
# clusters/cartyx-prod, which declares its own `cartyx-app-main` source; a
# main-branch source here would be unused, and pointing a cluster at a branch
# it does not deploy is how the wrong revision eventually ships.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cartyx-app-dev
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/biozal/cartyx-app
  ref:
    branch: dev
