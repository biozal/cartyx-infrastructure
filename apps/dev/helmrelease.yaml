apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cartyx
spec:
  interval: 5m
  chart:
    spec:
      chart: deploy/charts/cartyx
      # Revision strategy: repackage the chart on every commit to the branch
      # (the chart version stays 0.1.0; without this, only version bumps
      # would redeploy template changes).
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: cartyx-app-dev
        namespace: flux-system
      valuesFiles:
        - deploy/charts/cartyx/values.yaml
        - deploy/charts/cartyx/values-dev.yaml
  # Image tags only — everything else lives in the chart's values files.
  # CI (cartyx-app deploy.yml) seds these lines by their marker comments.
  values:
    web:
      image:
        tag: dev-1e10c52 # ci:web-tag
    realtime:
      image:
        tag: '1e10c52' # ci:realtime-tag
    # Placeholder until the first cartyx-app deploy seds a real SHA in. The
    # chart's `required` guard only checks the value is non-empty, so this
    # keeps the whole release rendering; the audio-worker pod itself will not
    # pull until CI replaces this. Harmless until the audio-worker template
    # ships, since nothing consumes the value before then.
    audioWorker:
      image:
        tag: '1e10c52' # ci:audioworker-tag
