secretName: cartyx-data
graphKeyspace: cartyx_graph
stateKeyspace: cartyx_state
datacenter: dc1
cassandra:
  image: ghcr.io/biozal/cartyx-cassandra@sha256:249aec9fb84e9fdcf2b2a16d5193c762d90aa395c2dba067f83a010a0525b17d
  replicas: 1
  heap: 1G
