# Deliberately single-node: scaling Cassandra needs a topology/repair migration.
environment: ''
secretName: cartyx-data
graphKeyspace: cartyx_graph
stateKeyspace: cartyx_state
datacenter: dc1
cassandra:
  image: ghcr.io/biozal/cartyx-cassandra@sha256:a8705b2f7660013a90eeba260521fe640d320da91fdf11c7dcd94ab3f9f0ebd8
  replicas: 1
  heap: 1G
  newHeap: 256M
  storageClass: cartyx-data-retain
  storage: 30Gi
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { cpu: '2', memory: 3Gi }
janusgraph:
  image: ghcr.io/biozal/cartyx-janusgraph@sha256:ebd0c068c444e2f8685117bb9cd104687304edb8553a1d575c8e493e8bfb849b
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 1536Mi }
    limits: { cpu: '2', memory: 2Gi }
networkPolicy:
  enabled: true
