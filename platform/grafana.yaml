# HelmRepository `grafana` is defined in alloy.yaml (Task 5) — not redefined here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: platform
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: '10.5.15' # PINNED via: helm search repo grafana/grafana --versions
      sourceRef: { kind: HelmRepository, name: grafana }
  values:
    fullnameOverride: grafana
    deploymentStrategy:
      type: Recreate # RWO PVC: RollingUpdate races two pods for the same volume
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    envFromSecret: platform # exposes DISCORD_WEBHOOK_URL, GRAFANA_RO_PASSWORD etc. as env
    plugins:
      - victoriametrics-logs-datasource
    grafana.ini:
      server:
        root_url: https://grafana.cartyx.io
      plugins:
        allow_loading_unsigned_plugins: victoriametrics-logs-datasource
      analytics:
        reporting_enabled: false
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            uid: victoriametrics
            type: prometheus
            access: proxy
            url: http://victoriametrics-server.platform.svc:8428
            isDefault: true
          - name: VictoriaLogs
            uid: victorialogs
            type: victoriametrics-logs-datasource
            access: proxy
            url: http://victorialogs-server.platform.svc:9428
          - name: Umami DB
            uid: umami-db
            type: postgres
            access: proxy
            url: postgres.platform.svc:5432
            database: umami
            user: grafana_ro
            secureJsonData:
              password: $GRAFANA_RO_PASSWORD
            jsonData: { sslmode: disable }
          - name: GlitchTip DB
            uid: glitchtip-db
            type: postgres
            access: proxy
            url: postgres.platform.svc:5432
            database: glitchtip
            user: grafana_ro
            secureJsonData:
              password: $GRAFANA_RO_PASSWORD
            jsonData: { sslmode: disable }
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            folder: ''
            type: file
            options: { path: /var/lib/grafana/dashboards/default }
    dashboards:
      default:
        cartyx-data:
          json: |
            {
              "schemaVersion": 39,
              "title": "Cartyx Data Infrastructure",
              "uid": "cartyx-data",
              "refresh": "30s",
              "time": {
                "from": "now-1h",
                "to": "now"
              },
              "panels": [
                {
                  "id": 1,
                  "type": "timeseries",
                  "title": "Memory by database container",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "victoriametrics"
                  },
                  "gridPos": {
                    "x": 0,
                    "y": 0,
                    "w": 12,
                    "h": 8
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "sum by (namespace, pod, container) (container_memory_working_set_bytes{namespace=~\"dev|prod\",pod=~\"cartyx-data-.*\",container!=\"\"})",
                      "legendFormat": "{{namespace}} {{pod}} {{container}}"
                    }
                  ],
                  "fieldConfig": {
                    "defaults": {
                      "unit": "bytes"
                    },
                    "overrides": []
                  }
                },
                {
                  "id": 2,
                  "type": "timeseries",
                  "title": "CPU by database container",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "victoriametrics"
                  },
                  "gridPos": {
                    "x": 12,
                    "y": 0,
                    "w": 12,
                    "h": 8
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "sum by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{namespace=~\"dev|prod\",pod=~\"cartyx-data-.*\",container!=\"\"}[5m]))",
                      "legendFormat": "{{namespace}} {{pod}} {{container}}"
                    }
                  ],
                  "fieldConfig": {
                    "defaults": {
                      "unit": "cores"
                    },
                    "overrides": []
                  }
                },
                {
                  "id": 3,
                  "type": "timeseries",
                  "title": "Ready Cassandra replicas",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "victoriametrics"
                  },
                  "gridPos": {
                    "x": 0,
                    "y": 8,
                    "w": 12,
                    "h": 8
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "kube_statefulset_status_replicas_ready{namespace=~\"dev|prod\",statefulset=\"cartyx-data-cassandra\"}",
                      "legendFormat": "{{namespace}} {{pod}} {{container}}"
                    }
                  ],
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short"
                    },
                    "overrides": []
                  }
                },
                {
                  "id": 4,
                  "type": "timeseries",
                  "title": "Available JanusGraph replicas",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "victoriametrics"
                  },
                  "gridPos": {
                    "x": 12,
                    "y": 8,
                    "w": 12,
                    "h": 8
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "kube_deployment_status_replicas_available{namespace=~\"dev|prod\",deployment=\"cartyx-data-janusgraph\"}",
                      "legendFormat": "{{namespace}} {{pod}} {{container}}"
                    }
                  ],
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short"
                    },
                    "overrides": []
                  }
                },
                {
                  "id": 5,
                  "type": "timeseries",
                  "title": "Container restarts",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "victoriametrics"
                  },
                  "gridPos": {
                    "x": 0,
                    "y": 16,
                    "w": 12,
                    "h": 8
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "increase(kube_pod_container_status_restarts_total{namespace=~\"dev|prod\",pod=~\"cartyx-data-.*\"}[1h])",
                      "legendFormat": "{{namespace}} {{pod}} {{container}}"
                    }
                  ],
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short"
                    },
                    "overrides": []
                  }
                },
                {
                  "id": 6,
                  "type": "stat",
                  "title": "Hours since verified off-host backup",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "victoriametrics"
                  },
                  "gridPos": {
                    "x": 0,
                    "y": 24,
                    "w": 12,
                    "h": 8
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "(time() - cartyx_data_backup_last_success_timestamp_seconds) / 3600 and on(environment) (cartyx_data_backup_last_success_timestamp_seconds > 0)",
                      "legendFormat": "{{environment}}",
                      "instant": true
                    }
                  ],
                  "fieldConfig": {
                    "defaults": {
                      "unit": "h"
                    },
                    "overrides": []
                  },
                  "options": {
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    }
                  }
                },
                {
                  "id": 7,
                  "type": "stat",
                  "title": "Database TLS certificate days remaining",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "victoriametrics"
                  },
                  "gridPos": {
                    "x": 12,
                    "y": 24,
                    "w": 12,
                    "h": 8
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "(cartyx_data_certificate_expiry_timestamp_seconds - time()) / 86400",
                      "legendFormat": "{{environment}}",
                      "instant": true
                    }
                  ],
                  "fieldConfig": {
                    "defaults": {
                      "unit": "d"
                    },
                    "overrides": []
                  },
                  "options": {
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    }
                  }
                },
                {
                  "id": 8,
                  "type": "stat",
                  "title": "Backup archive size",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "victoriametrics"
                  },
                  "gridPos": {
                    "x": 0,
                    "y": 32,
                    "w": 12,
                    "h": 8
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "cartyx_data_backup_archive_bytes",
                      "legendFormat": "{{environment}}",
                      "instant": true
                    }
                  ],
                  "fieldConfig": {
                    "defaults": {
                      "unit": "bytes"
                    },
                    "overrides": []
                  },
                  "options": {
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    }
                  }
                },
                {
                  "id": 9,
                  "type": "stat",
                  "title": "Backup failure state",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "victoriametrics"
                  },
                  "gridPos": {
                    "x": 12,
                    "y": 32,
                    "w": 12,
                    "h": 8
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "cartyx_data_backup_failed",
                      "legendFormat": "{{environment}}",
                      "instant": true
                    }
                  ],
                  "fieldConfig": {
                    "defaults": {
                      "unit": "none"
                    },
                    "overrides": []
                  },
                  "options": {
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    }
                  }
                }
              ]
            }
        k8s-global:
          gnetId: 15757 # "Kubernetes / Views / Global" (dotdc)
          revision: 43
          datasource: VictoriaMetrics
        k8s-pods:
          gnetId: 15760 # "Kubernetes / Views / Pods" (dotdc)
          revision: 39
          datasource: VictoriaMetrics
        cartyx-product:
          json: |
            {
              "schemaVersion": 39,
              "title": "Cartyx Product",
              "uid": "cartyx-product",
              "editable": true,
              "time": { "from": "now-24h", "to": "now" },
              "panels": [
                {
                  "id": 1,
                  "type": "stat",
                  "title": "Events (24h)",
                  "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
                  "datasource": { "type": "postgres", "uid": "umami-db" },
                  "targets": [
                    {
                      "refId": "A",
                      "datasource": { "type": "postgres", "uid": "umami-db" },
                      "rawSql": "SELECT count(*) FROM website_event WHERE created_at > now() - interval '24 hours';",
                      "format": "table"
                    }
                  ]
                },
                {
                  "id": 2,
                  "type": "stat",
                  "title": "Active error groups (24h)",
                  "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
                  "datasource": { "type": "postgres", "uid": "glitchtip-db" },
                  "targets": [
                    {
                      "refId": "A",
                      "datasource": { "type": "postgres", "uid": "glitchtip-db" },
                      "rawSql": "SELECT count(*) FROM issue_events_issue WHERE first_seen > now() - interval '24 hours';",
                      "format": "table"
                    }
                  ]
                }
              ]
            }
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: 'true'
      hosts: [grafana.cartyx.io]
      tls:
        - secretName: platform-cartyx-tls
          hosts: [grafana.cartyx.io]
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { memory: 384Mi }
    alerting:
      deleterules.yaml:
        apiVersion: 1
        deleteRules:
          - orgId: 1
            uid: pvc-near-full
      contactpoints.yaml:
        apiVersion: 1
        contactPoints:
          - orgId: 1
            name: discord
            receivers:
              - uid: discord-main
                type: discord
                settings:
                  url: $DISCORD_WEBHOOK_URL
      policies.yaml:
        apiVersion: 1
        policies:
          - orgId: 1
            receiver: discord
      rules.yaml:
        apiVersion: 1
        groups:
          - orgId: 1
            name: platform
            folder: Alerts
            interval: 5m
            rules:
              - uid: cartyx-data-unready
                title: Cartyx database unavailable
                condition: A
                for: 10m
                noDataState: OK
                execErrState: Error
                data:
                  - refId: A
                    relativeTimeRange: { from: 900, to: 0 }
                    datasourceUid: victoriametrics
                    model:
                      expr: (1 - kube_statefulset_status_replicas_ready{namespace=~"dev|prod",statefulset="cartyx-data-cassandra"}) > 0 or (1 - kube_deployment_status_replicas_available{namespace=~"dev|prod",deployment="cartyx-data-janusgraph"}) > 0
                      instant: true
              - uid: cartyx-data-backup-age
                title: Cartyx database backup older than 26 hours
                condition: A
                for: 10m
                noDataState: OK
                execErrState: Error
                data:
                  - refId: A
                    relativeTimeRange: { from: 900, to: 0 }
                    datasourceUid: victoriametrics
                    model:
                      expr: (time() - cartyx_data_backup_last_success_timestamp_seconds > 93600) and on(environment) (cartyx_data_backup_enabled == 1)
                      instant: true
              - uid: cartyx-data-backup-failed
                title: Cartyx database backup failed or needs recovery
                condition: A
                for: 10m
                noDataState: OK
                execErrState: Error
                data:
                  - refId: A
                    relativeTimeRange: { from: 900, to: 0 }
                    datasourceUid: victoriametrics
                    model:
                      expr: (cartyx_data_backup_failed == 1) or ((time() - cartyx_data_backup_last_attempt_timestamp_seconds > 3600) and on(environment) (cartyx_data_backup_in_progress == 1))
                      instant: true
              - uid: cartyx-data-certificate-expiry
                title: Cartyx database TLS certificate expires within 30 days
                condition: A
                for: 10m
                noDataState: OK
                execErrState: Error
                data:
                  - refId: A
                    relativeTimeRange: { from: 900, to: 0 }
                    datasourceUid: victoriametrics
                    model:
                      expr: (2592000 - (cartyx_data_certificate_expiry_timestamp_seconds - time())) > 0
                      instant: true
              - uid: cartyx-data-metrics-missing
                title: Cartyx database recovery metrics unavailable
                condition: A
                for: 10m
                noDataState: OK
                execErrState: Error
                data:
                  - refId: A
                    relativeTimeRange: { from: 900, to: 0 }
                    datasourceUid: victoriametrics
                    model:
                      expr: (1 - up{instance=~"cartyx-data-metrics[.](dev|prod)[.]svc:9095"}) > 0
                      instant: true
              - uid: pod-crashloop
                title: Pod crash-looping
                condition: A
                for: 10m
                noDataState: OK
                execErrState: Error
                data:
                  - refId: A
                    relativeTimeRange: { from: 900, to: 0 }
                    datasourceUid: victoriametrics
                    model:
                      expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
                      instant: true
              - uid: mem-near-limit
                title: Container memory > 90% of limit
                condition: A
                for: 15m
                noDataState: OK
                execErrState: Error
                data:
                  - refId: A
                    relativeTimeRange: { from: 900, to: 0 }
                    datasourceUid: victoriametrics
                    model:
                      expr: max by (namespace, pod, container) (container_memory_working_set_bytes) / max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"}) > 0.9
                      instant: true
              - uid: store-size-vl
                title: VictoriaLogs store size > 16GiB
                condition: A
                for: 30m
                noDataState: OK
                execErrState: Error
                data:
                  - refId: A
                    relativeTimeRange: { from: 900, to: 0 }
                    datasourceUid: victoriametrics
                    model:
                      expr: sum(vl_data_size_bytes) > 17179869184
                      instant: true
              - uid: store-size-vm
                title: VictoriaMetrics store size > 8GiB
                condition: A
                for: 30m
                noDataState: OK
                execErrState: Error
                data:
                  - refId: A
                    relativeTimeRange: { from: 900, to: 0 }
                    datasourceUid: victoriametrics
                    model:
                      expr: sum(vm_data_size_bytes) > 8589934592
                      instant: true
              - uid: node-disk
                title: Node root filesystem > 85% full
                condition: A
                for: 30m
                noDataState: OK
                execErrState: Error
                data:
                  - refId: A
                    relativeTimeRange: { from: 900, to: 0 }
                    datasourceUid: victoriametrics
                    model:
                      expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.85
                      instant: true
              - uid: logs-silent
                title: Log pipeline silent 15m
                condition: A
                for: 0m
                noDataState: OK
                execErrState: Error
                data:
                  - refId: A
                    relativeTimeRange: { from: 900, to: 0 }
                    datasourceUid: victoriametrics
                    model:
                      expr: absent(vl_rows_ingested_total) or (sum(increase(vl_rows_ingested_total[15m])) == 0)
                      instant: true
