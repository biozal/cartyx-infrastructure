apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "data.name" . }}-cassandra
  labels:
    {{- include "data.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.cassandra.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.cassandra.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "data.name" . }}-cassandra
spec:
  type: ClusterIP
  # Bootstrap must reach CQL before application credentials exist/readiness passes.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cassandra
  ports:
    - { name: cql-tls, port: 9042, targetPort: 9042 }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "data.name" . }}-cassandra-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cassandra
  ports:
    - { name: cql-tls, port: 9042, targetPort: 9042 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "data.name" . }}-cassandra
  labels:
    {{- include "data.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "data.name" . }}-cassandra-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cassandra
  template:
    metadata:
      labels:
        {{- include "data.labels" . | nindent 8 }}
        app.kubernetes.io/component: cassandra
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      securityContext:
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cassandra
          image: {{ .Values.cassandra.image | quote }}
          command: [bash, /config/cassandra-start.sh]
          env:
            - { name: CASSANDRA_CLUSTER_NAME, value: {{ printf "cartyx-%s" .Values.environment | quote }} }
            - { name: CASSANDRA_DC, value: {{ .Values.datacenter | quote }} }
            - { name: CASSANDRA_ENDPOINT_SNITCH, value: GossipingPropertyFileSnitch }
            # Single-node CQL metadata advertises the stable Service IP, never
            # the disposable Pod IP. Drivers can reconnect after pod replacement.
            - { name: CASSANDRA_BROADCAST_RPC_ADDRESS, value: {{ include "data.name" . }}-cassandra }
            - { name: CASSANDRA_HOST, value: localhost }
            - { name: STATE_KEYSPACE, value: {{ .Values.stateKeyspace | quote }} }
            - { name: MAX_HEAP_SIZE, value: {{ .Values.cassandra.heap | quote }} }
            - { name: HEAP_NEWSIZE, value: {{ .Values.cassandra.newHeap | quote }} }
          ports:
            - { name: cql-tls, containerPort: 9042 }
          lifecycle:
            preStop:
              exec: { command: [nodetool, drain] }
          resources:
            {{- toYaml .Values.cassandra.resources | nindent 12 }}
          startupProbe:
            tcpSocket: { port: cql-tls }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec: { command: [python3, /config/cassandra-admin.py, ready] }
            periodSeconds: 30
            timeoutSeconds: 35
            failureThreshold: 3
          # Liveness is process-local: auth/backend problems affect readiness.
          livenessProbe:
            tcpSocket: { port: cql-tls }
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - { name: data, mountPath: /var/lib/cassandra }
            - { name: config, mountPath: /config, readOnly: true }
            - { name: secrets, mountPath: /secrets, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ include "data.name" . }}-cassandra }
        - name: config
          configMap: { name: {{ include "data.name" . }}-config }
        - name: secrets
          secret:
            secretName: {{ .Values.secretName }}
            defaultMode: 0440
            items:
              - { key: tls.p12, path: tls.p12 }
              - { key: tls.crt, path: tls.crt }
              - { key: tls-password, path: tls-password }
              - { key: cassandra-admin-password, path: cassandra-admin-password }
