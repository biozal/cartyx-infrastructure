apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cartyx-data
spec:
  # Enable only after dev deployment/restore evidence and prod preflight.
  suspend: true
  interval: 5m
  timeout: 15m
  chart:
    spec:
      chart: deploy/charts/cartyx-data
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: cartyx-data-prod
        namespace: flux-system
      valuesFiles:
        - deploy/charts/cartyx-data/values.yaml
        - deploy/charts/cartyx-data/values-prod.yaml
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
