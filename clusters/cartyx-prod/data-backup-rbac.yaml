---
# Lets the prod backup job pause and resume its own Kustomization while it takes
# a cold backup. Prod only: this cluster has no data-dev Kustomization to grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cartyx-data-backup-prod
  namespace: flux-system
rules:
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    resourceNames: [data-prod]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cartyx-data-backup-prod
  namespace: flux-system
subjects:
  - { kind: ServiceAccount, name: cartyx-data-backup, namespace: prod }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cartyx-data-backup-prod
