# Included by compose.yaml, also usable independently without application .env.
services:
  cassandra:
    image: ${CARTYX_CASSANDRA_IMAGE:-ghcr.io/biozal/cartyx-cassandra@sha256:249aec9fb84e9fdcf2b2a16d5193c762d90aa395c2dba067f83a010a0525b17d}
    entrypoint: [bash, /config/cassandra-start.sh]
    environment:
      CASSANDRA_CLUSTER_NAME: cartyx-local
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_HOST: localhost
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ../charts/cartyx-data/files:/config:ro
      - ../../.local/data/local:/secrets:ro
    # CQL is internal only. Use exec for administration; no default-login window
    # is exposed on the host during initial provisioning.
    healthcheck:
      test: [CMD, python3, /config/cassandra-admin.py, ready]
      interval: 30s
      timeout: 35s
      retries: 5
      start_period: 180s
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped

  cassandra-init:
    image: ${CARTYX_CASSANDRA_IMAGE:-ghcr.io/biozal/cartyx-cassandra@sha256:249aec9fb84e9fdcf2b2a16d5193c762d90aa395c2dba067f83a010a0525b17d}
    entrypoint: [python3, /config/cassandra-admin.py, bootstrap]
    environment:
      CASSANDRA_HOST: cassandra
    volumes:
      - ../charts/cartyx-data/files:/config:ro
      - ../../.local/data/local:/secrets:ro
    depends_on:
      cassandra:
        condition: service_started
    mem_limit: 256m
    restart: 'no'

  janusgraph:
    image: ${CARTYX_JANUSGRAPH_IMAGE:-ghcr.io/biozal/cartyx-janusgraph@sha256:b1c05e2e77e8fbb058b3e0bf2cb334a0be78291e17480e98d610a26812028a0b}
    entrypoint: [bash, /config/janusgraph-start.sh]
    environment:
      CASSANDRA_HOST: cassandra
    ports:
      - '127.0.0.1:${GREMLIN_LOCAL_PORT:-18182}:8182'
    volumes:
      - ../charts/cartyx-data/files:/config:ro
      - ../../.local/data/local:/secrets:ro
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD-SHELL,
          'java -Xms32m -Xmx128m -cp "lib/*" groovy.ui.GroovyMain /config/graph-probe.groovy >/dev/null 2>&1',
        ]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped

volumes:
  cassandra-data:
