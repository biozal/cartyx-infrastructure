# Deliberately single-node: scaling Cassandra needs a topology/repair migration.
environment: ''
secretName: cartyx-data
graphKeyspace: cartyx_graph
stateKeyspace: cartyx_state
datacenter: dc1
cassandra:
  image: ghcr.io/biozal/cartyx-cassandra@sha256:69b8820823c2144d69212d0d996c70faaa8043f28f764d45e85a9d7a7cf9d85a
  replicas: 1
  heap: 1G
  newHeap: 256M
  storageClass: cartyx-data-retain
  storage: 30Gi
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { cpu: '2', memory: 3Gi }
janusgraph:
  indexStorageClass: cartyx-data-retain
  indexStorage: 5Gi
  image: ghcr.io/biozal/cartyx-janusgraph@sha256:1ecf29b82909bf3ea5c39aa0af7e9f065600c3924f4729ec49bb999dda9f3ba8
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 1536Mi }
    limits: { cpu: '2', memory: 2Gi }
networkPolicy:
  enabled: true
