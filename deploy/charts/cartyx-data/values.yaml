janusgraph:
  image: ghcr.io/biozal/cartyx-janusgraph@sha256:afa8a11d129f1cab44e5998565f92a950d916d2c94a677e8114849967372a375
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 1536Mi }
    limits: { cpu: '2', memory: 2Gi }
networkPolicy:
  enabled: true
