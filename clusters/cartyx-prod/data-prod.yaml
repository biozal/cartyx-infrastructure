apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: data-prod
  namespace: flux-system
spec:
  interval: 5m
  path: ./data/prod
  prune: false
  sourceRef:
    kind: GitRepository
    name: cartyx-data-prod
  dependsOn:
    - name: infrastructure
  wait: true
  timeout: 15m
