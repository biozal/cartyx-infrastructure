janusgraph:
  image: ghcr.io/biozal/cartyx-janusgraph@sha256:73d1ec1a93ea3e339ecc85c7918a7a7a1dea946db40a0cda59715f3a784270d5
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 1536Mi }
    limits: { cpu: '2', memory: 2Gi }
networkPolicy:
  enabled: true
